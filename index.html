<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UstazMentor - 3D Animation Studio Ойыны</title>
    <style>
        body {
            background: linear-gradient(135deg, #0b0f19 0%, #1a103c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #00ffcc;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            border: 2px solid #a855f7;
        }
        h1 {
            color: #a855f7;
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.7);
        }
        .subtitle {
            color: #00ffcc;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        .name-section {
            background: rgba(30, 41, 59, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            text-align: center;
        }
        .name-section input {
            padding: 12px;
            width: 70%;
            border-radius: 8px;
            border: 1px solid #a855f7;
            background: #0b0f19;
            color: #00ffcc;
            font-size: 16px;
            margin-right: 10px;
            outline: none;
            text-align: center;
        }
        .btn {
            background: linear-gradient(45deg, #a855f7, #00ffcc);
            color: #0b0f19;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }
        .game-screen {
            display: none;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.9);
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            border: 1px solid #00ffcc;
        }
        /* Анимация шкаласы (Timeline) */
        .timeline-track {
            background: #0b0f19;
            border-radius: 12px;
            height: 25px;
            width: 100%;
            position: relative;
            margin-bottom: 15px;
            border: 1px solid #a855f7;
            overflow: hidden;
        }
        .timeline-fill {
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #00ffcc);
            width: 0%;
            transition: width 0.6s ease;
            box-shadow: 0 0 15px #00ffcc;
        }
        .mission-card {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #a855f7;
            margin-bottom: 15px;
        }
        .mission-title {
            color: #a855f7;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .opt-option {
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 12px 15px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: 0.2s;
        }
        .opt-option:hover {
            background: rgba(0, 255, 204, 0.2);
            border-color: #a855f7;
        }
        .attempts-info {
            color: #ffcc00;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: right;
        }
        .result-screen {
            display: none;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 3D Animation Studio</h1>
    <div class="subtitle">7.3.2.2 — Кілттік кадрлар (Keyframes): Орын, айналу, масштаб</div>
    <hr style="border-top: 1px solid #a855f7; margin-bottom: 20px;">

    <!-- Ойыншы атын енгізу -->
    <div class="name-section" id="nameSection">
        <h3 style="color: #00ffcc; margin-top: 0;">🎥 Аниматор-режиссер идентификаторы:</h3>
        <p style="color: #94a3b8; font-size: 13px;">Студияға қосылу үшін аты-жөніңізді енгізіңіз:</p>
        <input type="text" id="studentName" placeholder="Мысалы: Аружан Аниматор">
        <button class="btn" onclick="startGame()">Студияны іске қосу ⚡</button>
    </div>

    <!-- Ойын экраны -->
    <div class="game-screen" id="gameScreen">
        <div class="stats-bar">
            <span id="playerDisplay" style="color: #00ffcc;">Режиссер: ---</span>
            <span id="levelDisplay" style="color: #a855f7;">Кадр: 1 / 5</span>
            <span id="scoreDisplay" style="color: #00ff00;">Ұпай: 0 балл</span>
        </div>

        <!-- Анимациялық таймлайн шкаласы -->
        <div class="timeline-track">
            <div class="timeline-fill" id="timelineFill"></div>
        </div>

        <div class="mission-card" id="missionCard">
            <!-- Динамикалық миссиялар осында жүктеледі -->
        </div>
    </div>

    <!-- Қорытынды экран -->
    <div class="result-screen" id="resultScreen">
        <h2 style="color: #a855f7;">🌟 Анимациялық Жоба Сәтті Аяқталды!</h2>
        <p id="finalText" style="font-size: 18px; color: #ffffff;"></p>
        <div id="badgeBox" style="font-size: 20px; margin: 20px 0; color: #00ffcc;"></div>
        <button class="btn" onclick="location.reload()">Жаңа жоба бастау 🔄</button>
    </div>
</div>

<script>
    let playerName = "";
    let currentMission = 0;
    let score = 0;
    let attemptsLeft = 2;

    // Web Audio API арқылы сыртқы файлсыз дыбыс шығару функциялары
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'click') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'success') {
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // 5 функционалдық сауаттылыққа бағытталған өмірлік жағдаят кейстері
    const missions = [
        {
            title: "🎬 1-кейс: Компьютерлік ойындағы кейіпкердің қозғалысы (Location / Орын)",
            desc: "Оқушылар жасап жатқан мобильді ойында 3D робот кейіпкер экранның сол жағынан оң жағына қарай жүріп өтуі керек. Аниматор таймлайн бойында роботтың бұл орын ауыстыруын қандай құрал арқылы белгілейді?",
            options: [
                "А) Бастапқы және соңғы кілттік кадрларда нысанның орнын (Position) өзгерту арқылы",
                "Б) Тек қағазға сызу арқылы",
                "В) Дыбысты өшіру арқылы",
                "Г) Мониторды тазалау арқылы"
            ],
            correct: "А) Бастапқы және соңғы кілттік кадрларда нысанның орнын (Position) өзгерту арқылы"
        },
        {
            title: "🌀 2-кейс: Жарнамалық роликтегі өнімді айналдыру (Rotation / Айналу)",
            desc: "Дизайнер жаңа смарткластың (көзілдіріктің) 3D жарнамасын жасап жатыр. Тұтынушы өнімді жан-жағынан көруі үшін 3D моделі өз осі бойынша 360 градусқа айналуы тиіс. Аниматор бұл үшін нені қолданады?",
            options: [
                "А) Масштабты кішірейтуді",
                "Б) Кілттік кадрларда айналу бұрышын (Rotation) орнатуды",
                "В) Мәтін теруді",
                "Г) Файлды мұрағаттауды"
            ],
            correct: "Б) Кілттік кадрларда айналу бұрышын (Rotation) орнатуды"
        },
        {
            title: "🔍 3-кейс: Мультфильмдегі нысанның үлкеюі (Scale / Масштаб)",
            desc: "Мультипликатор балаларға арналған анимациялық фильмде сиқырлы алманың экранда біртіндеп үлкейіп, экранды толтырып жібергенін көрсеткісі келеді. Бұл анимациялық әсерді беру үшін қай параметрдің кілттік кадрлары өзгереді?",
            options: [
                "А) Scale (Масштаб / Өлшем)",
                "Б) Position (Орын)",
                "В) Rotation (Айналу бұрышы)",
                "Г) Мәтін шрифті"
            ],
            correct: "А) Scale (Масштаб / Өлшем)"
        },
        {
            title: "⏱️ 4-кейс: Кілттік кадрлардың (Keyframes) қызметі",
            desc: "3D анимация бағдарламасында (мысалы, Blender) аниматор уақыт шкаласында (Timeline) белгілі бір кадрларға арнайы белгілер қояды. Осы <b>кілттік кадрлардың (Keyframes)</b> басты мақсаты не?",
            options: [
                "А) Нысанның белгілі бір уақыт сәтіндегі күйін (орнын, пішінін, айналуын) сақтап, компьютерге анимация жасауды үйрету",
                "Б) Компьютерді өшіріп тастау",
                "В) Интернет трафигін есептеу",
                "Г) Пернетақтаны құлыптау"
            ],
            correct: "А) Нысанның белгілі бір уақыт сәтіндегі күйін (орнын, пішінін, айналуын) сақтап, компьютерге анимация жасауды үйрету"
        },
        {
            title: "🚀 5-кейс: Кешенді анимация (Орын, айналу және масштаб)",
            desc: "Мектеп оқушысы ғылыми жобасына арналған 3D зымыранның ұшу анимациясын дайындады: зымыран ұшып шығады, айналып жоғары қарай бағыт алады және алыстаған сайын кішірейеді. Бұл анимацияны жасауда қандай құралдар қатар қолданылған?",
            options: [
                "А) Тек мәтіндік кодтар",
                "Б) Position (Орын), Rotation (Айналу) және Scale (Масштаб) кілттік кадрлары",
                "В) Тек қағаз бен қарындаш",
                "Г) Кестелік процессор"
            ],
            correct: "Б) Position (Орын), Rotation (Айналу) және Scale (Масштаб) кілттік кадрлары"
        }
    ];

    function startGame() {
        playSound('click');
        const input = document.getElementById("studentName");
        if(input.value.trim() === "") {
            alert("⚠️ Режиссердің аты-жөнін енгізіңіз!");
            return;
        }
        playerName = input.value.trim();
        document.getElementById("playerDisplay").innerText = `Режиссер: ${playerName}`;
        document.getElementById("nameSection").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        loadMission();
    }

    function loadMission() {
        if(currentMission >= missions.length) {
            endGame();
            return;
        }
        
        attemptsLeft = 2;
        document.getElementById("levelDisplay").innerText = `Кадр: ${currentMission + 1} / 5`;
        document.getElementById("scoreDisplay").innerText = `Ұпай: ${score} балл`;
        
        const mis = missions[currentMission];
        const card = document.getElementById("missionCard");
        
        let html = `
            <div class="mission-title">${mis.title}</div>
            <div class="attempts-info" id="attemptsInfo">Қалған попытка: 2 🔄</div>
            <p>${mis.desc}</p>
            <div class="options-list">
        `;
        mis.options.forEach(opt => {
            html += `<div class="opt-option" onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}')">${opt}</div>`;
        });
        html += `</div>`;
        card.innerHTML = html;
    }

    function checkAnswer(element, selectedOption) {
        playSound('click');
        const mis = missions[currentMission];
        
        if(selectedOption === mis.correct) {
            playSound('success');
            score += 2;
            let percentage = score * 10;
            document.getElementById("timelineFill").style.width = percentage + "%";
            document.getElementById("scoreDisplay").innerText = `Ұпай: ${score} балл`;
            
            alert("⚡ Тамаша! Анимация кадры сәтті орындалды (+2 ұпай)!");
            currentMission++;
            loadMission();
        } else {
            attemptsLeft--;
            if(attemptsLeft > 0) {
                playSound('error');
                element.style.background = "rgba(255, 0, 0, 0.3)";
                element.style.pointerEvents = "none";
                document.getElementById("attemptsInfo").innerText = `Қалған попытка: ${attemptsLeft} 🔄`;
                alert("❌ Қате жауап! Тағы 1 попыткаңыз қалды, мұқият ойланыңыз.");
            } else {
                playSound('error');
                alert(`⚠️ Попыткалар таусылды! Дұрыс жауап:\n\n${mis.correct}`);
                currentMission++;
                loadMission();
            }
        }
    }

    function endGame() {
        playSound('success');
        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("resultScreen").style.display = "block";
        document.getElementById("finalText").innerHTML = `Құттықтаймыз, режиссер <b>${playerName}</b>!<br>Анимациялық жобадан жинаған жалпы нәтижеңіз: 10 ұпайдан <b>${score} балл</b>.`;
        
        let badge = "";
        if(score === 10) badge = "🌟 Бас 3D Аниматор & Motion Дизайнер!";
        else if(score >= 6) badge = "👍 Тәжірибелі 3D Режиссер!";
        else badge = "💡 Анимация ережелерін қайта қарап шығу керек!";
        
        document.getElementById("badgeBox").innerText = badge;
    }
</script>

</body>
</html>
